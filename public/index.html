<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harold Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal-container">
        <header class="portal-header">
            <div class="logo">
                <div class="logo-icon">H</div>
                <h1>Harold</h1>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
                <span id="ollama-status" class="ollama-status" title="Ollama connection status">Ollama: …</span>
            </div>
        </header>

        <main class="chat-container">
            <div class="translate-bar" id="translate-bar">
                <input type="text" id="translate-input" placeholder="Paste text to translate…" autocomplete="off">
                <select id="translate-target" title="Target language">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="ru">Russian</option>
                    <option value="ar">Arabic</option>
                </select>
                <button type="button" id="translate-btn" class="translate-btn">Translate</button>
                <span id="translate-status" class="translate-status"></span>
            </div>
            <div class="messages" id="messages">
                <div class="message bot-message">
                    <div class="avatar">H</div>
                    <div class="message-content">
                        <div class="message-bubble">
                            Hello! I'm Harold, your AI assistant. How can I help you today?
                        </div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <form id="chat-form" class="chat-input">
                    <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
                    <button type="submit" class="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>
            </div>
        </main>

        <aside class="extensions-panel" id="extensions-panel">
            <h2>Extensions</h2>
            <div id="extensions-list"></div>
        </aside>

        <footer class="portal-footer">
            <p>Harold Portal • Static Version</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
